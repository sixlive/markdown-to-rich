<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Markdown to Rich Text</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f4f5f7; --text: #1d2125; --muted: #626f86; --accent: #0b57d0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161a1d; --text: #dee4ea; --muted: #96a2b0; --accent: #7aa7f7; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There's nothing at this address.</p>
      <a href="/">Go to the Markdown to Rich Text converter</a>
    </main>
  </body>
</html>
